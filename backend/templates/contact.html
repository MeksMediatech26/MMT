<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>Meks Media Tech – Contact Us</title>

<!-- Preact UMD -->
<script src="https://unpkg.com/preact@10.5.13/dist/preact.umd.js"></script>
<script src="https://unpkg.com/preact@10.5.13/hooks/dist/hooks.umd.js"></script>

<style>
:root { --accent: #A6700C; }
body { margin:0; background:#000; color:#fff; font-family:Arial; line-height:1.7; overflow-x:hidden; word-wrap:break-word; }
header { display:flex; justify-content:space-between; align-items:center; padding:1rem; background:#111; border-bottom:1px solid var(--accent); width:100%; box-sizing:border-box; }
header img { height:40px; max-width:90%; object-fit:contain; }
.hamburger { font-size:26px; cursor:pointer; color:var(--accent); }
.sidebar { position:fixed; top:0; left:-260px; width:260px; max-width:80%; height:100vh; background:#111; border-right:2px solid var(--accent); transition:left .3s; padding-top:60px; z-index:2000; box-sizing:border-box; }
.sidebar.open { left:0; }
.sidebar a { display:block; padding:1rem; color:#fff; text-decoration:none; border-bottom:1px solid #222; word-wrap:break-word; }
.sidebar a:hover { background:var(--accent); color:black; }
.container { padding:1rem; max-width:900px; width:95%; margin:auto; box-sizing:border-box; word-wrap:break-word; }
h1,h2 { text-align:center; color:var(--accent); margin-bottom:1rem; word-wrap:break-word; }
.form-narrow { max-width:100%; margin:0 auto; padding-right:0; box-sizing:border-box; }
form label { display:block; margin:10px 0 6px; color:#ddd; font-size:14px; word-wrap:break-word; white-space:pre-wrap; }
form input, form select, form textarea { width:100%; padding:8px; margin-bottom:10px; border-radius:5px; border:none; background:#0f0f0f; color:#fff; font-size:14px; box-sizing:border-box; box-shadow: inset 0 0 0 1px #222; }
.btn { background:var(--accent); color:black; border:none; padding:10px; border-radius:5px; cursor:pointer; width:100%; font-weight:bold; box-sizing:border-box; }
.btn:disabled { opacity:.7; cursor:not-allowed; }
.collapse-header { background:#111; padding:10px; border-radius:5px; cursor:pointer; border:1px solid #333; color:var(--accent); margin-bottom:5px; text-align:center; font-weight:bold; }
.collapse-content { display:none; padding:10px; background:#0e0e0e; border-radius:5px; border:1px solid #222; margin-bottom:10px; word-wrap:break-word; white-space:pre-wrap; }
.collapse-content.open { display:block; }
.checkbox-wrap { display:flex; align-items:center; gap:6px; padding:4px 0; flex-wrap:wrap; }
.state-input-wrap { position:relative; width:100%; }
.state-search-results { position:absolute; top:100%; left:0; width:100%; background:#111; border:1px solid #333; border-radius:5px; max-height:180px; overflow-y:auto; display:none; z-index:50; }
.state-item { padding:8px; cursor:pointer; border-bottom:1px solid #222; }
.state-item:hover { background:var(--accent); color:black; }
#mapModal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.8); display:none; justify-content:center; align-items:center; z-index:2000; box-sizing:border-box; }
#mapModal iframe { width:95%; height:70%; border:none; border-radius:10px; max-width:900px; }
footer { margin-top:2rem; padding:1rem; background:#111; border-top:1px solid var(--accent); text-align:center; box-sizing:border-box; }
footer a { color:var(--accent); margin:0 10px; text-decoration:none; word-wrap:break-word; }
.social-floating { position:fixed; bottom:25px; right:20px; display:flex; flex-direction:column; gap:12px; z-index:1001; }
.social-floating a { width:50px; height:50px; border-radius:50%; display:flex; justify-content:center; align-items:center; cursor:pointer; }
.social-floating img { width:24px; height:24px; }
.error-text { color: #ff4444; font-size:12px; margin-top:2px; display:block; }
.input-error { box-shadow: inset 0 0 0 1px #ff4444 !important; }
@media (max-width:600px){
    .container { padding:0.8rem; }
    .form-narrow { padding-right:0; }
    header img { max-width:80%; }
    .sidebar { width:220px; }
    .social-floating { right:10px; bottom:15px; gap:8px; }
    .social-floating a { width:40px; height:40px; }
    .social-floating img { width:20px; height:20px; }
}
</style>
</head>
<body>

<header>
    <div class="hamburger" onclick="toggleSidebar()">☰</div>
    <img src="assets/logo.png" alt="Meks Media Tech Logo"/>
</header>

<div id="sidebar" class="sidebar">
    <a href="/">Home</a>
    <a href="/about">About</a>
    <a href="/services">Services</a>
    <a href="/gallery">Gallery</a>
    <a href="/testimonials">Testimonials</a>
    <a href="/contact" style="background:var(--accent);color:black;">Contact</a>
</div>

<div id="app"></div>

<div id="mapModal" onclick="this.style.display='none'">
    <iframe src="https://www.google.com/maps?q=123+Solar+Street+Ikeja+Lagos&output=embed"></iframe>
</div>

<script>
let sidebar = document.getElementById("sidebar"), sidebarTimer;
function toggleSidebar(){ sidebar.classList.toggle("open"); resetSidebarAutoClose(); }
function closeSidebar(){ sidebar.classList.remove("open"); }
function resetSidebarAutoClose(){ clearTimeout(sidebarTimer); sidebarTimer=setTimeout(closeSidebar,5000); }
document.body.addEventListener("click", e=>{ if(!sidebar.contains(e.target)&&!e.target.classList.contains("hamburger")) closeSidebar(); });
sidebar.addEventListener("mouseleave", ()=>{ sidebarTimer=setTimeout(closeSidebar,3000); });

const { h, render } = preact;
const { useState, useEffect } = preactHooks;
const API_BASE = window.location.origin;

const NIGERIA_STATES = [
"Abia","Adamawa","Akwa Ibom","Anambra","Bauchi","Bayelsa","Benue","Borno","Cross River",
"Delta","Ebonyi","Edo","Ekiti","Enugu","Gombe","Imo","Jigawa","Kaduna","Kano","Katsina",
"Kebbi","Kogi","Kwara","Lagos","Nasarawa","Niger","Ogun","Ondo","Osun","Oyo","Plateau",
"Rivers","Sokoto","Taraba","Yobe","Zamfara","FCT Abuja"
];

function StateSelector({ value, onSelect, error }) {
    const [query,setQuery]=useState(""); const [open,setOpen]=useState(false);
    const filtered=NIGERIA_STATES.filter(s=>s.toLowerCase().includes(query.toLowerCase()));
    return h("div",{class:"state-input-wrap"},[
        h("input",{ 
            type:"text", 
            value:value||query, 
            placeholder:"Select State", 
            onInput:e=>{ setQuery(e.target.value); setOpen(true); }, 
            onFocus:()=>setOpen(true), 
            style:"cursor:text;", 
            class: error ? "input-error" : ""
        }),
        h("div",{ class:"state-search-results", style:`display:${open?"block":"none"}` },
            filtered.map(st=>h("div",{ class:"state-item", onClick:()=>{ onSelect(st); setQuery(st); setOpen(false); } },st))
        )
    ]);
}

function ContactPage(){
    const [quoteData,setQuoteData]=useState({fullname:'',contact:'',service:'',extras:[],date:'',details:'',state:''});
    const [formData,setFormData]=useState({name:'',contact:'',message:'',state:''});
    const [collapseOpen,setCollapseOpen]=useState(false);
    const [services,setServices]=useState([]);
    const [quoteErrors, setQuoteErrors] = useState({});
    const [contactErrors, setContactErrors] = useState({});
    const [quoteSubmitting, setQuoteSubmitting] = useState(false);
    const [contactSubmitting, setContactSubmitting] = useState(false);

    useEffect(()=>{
        async function loadServices(){
            try{
                const res = await fetch(`/api/services`);
                if(res.ok){
                    const data = await res.json();
                    setServices(data.services || data || []);
                }
            }catch(e){ console.error("Failed to fetch services", e); }
        }
        loadServices();
    },[]);

    function isValidContact(value){
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const phoneRegex = /^(?:\+?\d{1,3})?[ -]?\d{7,14}$/;
        return emailRegex.test(value) || phoneRegex.test(value);
    }

    const validateQuoteForm = () => {
        const errors = {};
        
        if (!quoteData.fullname.trim()) {
            errors.fullname = 'Full name is required';
        }
        
        if (!quoteData.contact.trim()) {
            errors.contact = 'Contact is required';
        } else if (!isValidContact(quoteData.contact)) {
            errors.contact = 'Please enter a valid email or phone number';
        }
        
        if (!quoteData.state) {
            errors.state = 'State is required';
        }
        
        if (!quoteData.service) {
            errors.service = 'Service selection is required';
        }
        
        setQuoteErrors(errors);
        return Object.keys(errors).length === 0;
    };

    const validateContactForm = () => {
        const errors = {};
        
        if (!formData.name.trim()) {
            errors.name = 'Name is required';
        }
        
        if (!formData.contact.trim()) {
            errors.contact = 'Contact is required';
        } else if (!isValidContact(formData.contact)) {
            errors.contact = 'Please enter a valid email or phone number';
        }
        
        if (!formData.state) {
            errors.state = 'State is required';
        }
        
        if (!formData.message.trim()) {
            errors.message = 'Message is required';
        }
        
        setContactErrors(errors);
        return Object.keys(errors).length === 0;
    };

    const submitQuote=async(e)=>{
        e.preventDefault();
        
        if (!validateQuoteForm()) {
            alert("Please fill in all required fields correctly.");
            return;
        }
        
        setQuoteSubmitting(true);
        
        try{
            // Create FormData for quote submission
            const formData = new FormData();
            formData.append('fullname', quoteData.fullname);
            formData.append('contact', quoteData.contact);
            formData.append('service', quoteData.service);
            formData.append('state', quoteData.state);
            formData.append('date', quoteData.date);
            formData.append('details', quoteData.details);
            
            // Append each extra requirement individually
            quoteData.extras.forEach(extra => {
                formData.append('extras', extra);
            });
            
            // Submit using FormData (no Content-Type header needed)
            const res = await fetch(`/api/quote`, { 
                method:'POST', 
                body: formData
            });
            
            if(res.ok) {
                alert("Quote submitted successfully! We will contact you soon.");
                setQuoteData({fullname:'',contact:'',service:'',extras:[],date:'',details:'',state:''});
                setQuoteErrors({});
            } else {
                alert("Failed to submit quote. Please try again.");
            }
        }catch(err){ 
            console.error(err); 
            alert("Error submitting quote. Please try again."); 
        } finally {
            setQuoteSubmitting(false);
        }
    };

    const handleSubmit=async(e)=>{
        e.preventDefault();
        
        if (!validateContactForm()) {
            alert("Please fill in all required fields correctly.");
            return;
        }
        
        setContactSubmitting(true);
        
        try{
            // Create FormData for contact submission
            const formDataObj = new FormData();
            formDataObj.append('name', formData.name);
            formDataObj.append('contact', formData.contact);
            formDataObj.append('message', formData.message);
            formDataObj.append('state', formData.state);
            
            // Submit using FormData (no Content-Type header needed)
            const res = await fetch(`/api/contact`, { 
                method:'POST', 
                body: formDataObj
            });
            
            if(res.ok) {
                alert("Message sent successfully! We will get back to you soon.");
                setFormData({name:'',contact:'',message:'',state:''});
                setContactErrors({});
            } else {
                alert("Failed to send message. Please try again.");
            }
        }catch(err){ 
            console.error(err); 
            alert("Error sending message. Please try again."); 
        } finally {
            setContactSubmitting(false);
        }
    };

    return h("div",{},[
        h("div",{ class:"container" },[

            h("h1",{}, "Request a Quote"),
            h("p",{ style:"text-align:center;color:#ccc" },"Get pricing for installations & services."),

            h("form",{ class:"form-narrow", onSubmit:submitQuote },[
                h("label",{}, "Full Name *"),
                h("input",{ 
                    name: "fullname",
                    value:quoteData.fullname, 
                    onInput:e=>setQuoteData({...quoteData,fullname:e.target.value}),
                    class: quoteErrors.fullname ? "input-error" : ""
                }),
                quoteErrors.fullname && h("span", { class:"error-text" }, quoteErrors.fullname),

                h("label",{}, "Contact (Email or Phone Number) *"),
                h("input",{ 
                    name: "contact",
                    value:quoteData.contact, 
                    onInput:e=>setQuoteData({...quoteData,contact:e.target.value}),
                    class: quoteErrors.contact ? "input-error" : ""
                }),
                quoteErrors.contact && h("span", { class:"error-text" }, quoteErrors.contact),

                h("label",{}, "Select State *"),
                h(StateSelector,{ 
                    value:quoteData.state, 
                    onSelect:st=>setQuoteData({...quoteData,state:st}),
                    error: quoteErrors.state
                }),
                quoteErrors.state && h("span", { class:"error-text" }, quoteErrors.state),

                h("label",{}, "Select Service *"),
                h("select",{ 
                    name: "service",
                    value:quoteData.service, 
                    onInput:e=>setQuoteData({...quoteData,service:e.target.value}),
                    class: quoteErrors.service ? "input-error" : ""
                },[
                    h("option",{ value:"" },"Choose Service"),
                    ...services.map(s=>h("option",{ value:s.title || s.name },s.title || s.name))
                ]),
                quoteErrors.service && h("span", { class:"error-text" }, quoteErrors.service),

                h("div",{ class:"collapse-header", onclick:()=>setCollapseOpen(!collapseOpen) },"Additional Requirements (tap to expand)"),
                h("div",{ class:`collapse-content ${collapseOpen?"open":""}` },
                    ["Site Inspection","Maintenance Plan","Urgent Delivery","Extended Warranty"].map(item =>
                        h("label",{ class:"checkbox-wrap" },[
                            h("input",{ 
                                type:"checkbox", 
                                name: "extras",
                                value: item,
                                checked:quoteData.extras.includes(item), 
                                onInput:()=>setQuoteData({...quoteData,extras:quoteData.extras.includes(item)?quoteData.extras.filter(x=>x!==item):[...quoteData.extras,item]}) 
                            }),
                            item
                        ])
                    )
                ),

                h("label",{}, "Preferred Installation Date"),
                h("input",{ 
                    name: "date",
                    type:"date", 
                    value:quoteData.date, 
                    onInput:e=>setQuoteData({...quoteData,date:e.target.value}) 
                }),

                h("label",{}, "Project Details"),
                h("textarea",{ 
                    name: "details",
                    rows:4, 
                    value:quoteData.details, 
                    onInput:e=>setQuoteData({...quoteData,details:e.target.value}) 
                }),

                h("button",{ class:"btn", type:"submit", disabled:quoteSubmitting }, quoteSubmitting ? "Submitting..." : "Submit Quote")
            ]),

            h("h2",{ style:"margin-top:50px" },"Contact Us"),
            h("p",{ style:"text-align:center;color:#ccc" },"Send us a message."),

            h("form",{ class:"form-narrow", onSubmit:handleSubmit },[
                h("label",{}, "Name *"),
                h("input",{ 
                    name: "name",
                    value:formData.name, 
                    onInput:e=>setFormData({...formData,name:e.target.value}),
                    class: contactErrors.name ? "input-error" : ""
                }),
                contactErrors.name && h("span", { class:"error-text" }, contactErrors.name),

                h("label",{}, "Contact (Email or Phone Number) *"),
                h("input",{ 
                    name: "contact",
                    value:formData.contact, 
                    onInput:e=>setFormData({...formData,contact:e.target.value}),
                    class: contactErrors.contact ? "input-error" : ""
                }),
                contactErrors.contact && h("span", { class:"error-text" }, contactErrors.contact),

                h("label",{}, "Select State *"),
                h(StateSelector,{ 
                    value:formData.state, 
                    onSelect:st=>setFormData({...formData,state:st}),
                    error: contactErrors.state
                }),
                contactErrors.state && h("span", { class:"error-text" }, contactErrors.state),

                h("label",{}, "Message *"),
                h("textarea",{ 
                    name: "message",
                    rows:5, 
                    value:formData.message, 
                    onInput:e=>setFormData({...formData,message:e.target.value}),
                    class: contactErrors.message ? "input-error" : ""
                }),
                contactErrors.message && h("span", { class:"error-text" }, contactErrors.message),

                h("button",{ class:"btn", type:"submit", disabled:contactSubmitting }, contactSubmitting ? "Sending..." : "Send Message")
            ]),

            h("div",{ style:"margin-top:40px;text-align:center" },[
                h("h3",{}, "Office Address"),
                h("p",{},"123 Solar Street, Ikeja, Lagos"),
                h("button",{ class:"btn", style:"margin-top:10px", onclick:()=>document.getElementById("mapModal").style.display="flex" },"View Map")
            ])
        ]),

        h("footer",{},[
            h("a",{ href:"/" },"Home"),
            h("a",{ href:"/about" },"About"),
            h("a",{ href:"/services" },"Services"),
            h("a",{ href:"/gallery" },"Gallery"),
            h("a",{ href:"/testimonials" },"Testimonials"),
            h("a",{ href:"/contact" },"Contact"),
            h("p",{ style:"color:#555;margin-top:10px" },"© 2025 Meks Media Tech")
        ]),

        h("div",{ class:"social-floating" },[
            h("a",{ href:"https://wa.me/2347038164548", target:"_blank", style:"background:#25D366;" }, h("img",{ src:"assets/whatsapp.png", alt:"WhatsApp" })),
            h("a",{ href:"https://instagram.com/meksmediatech", target:"_blank", style:"background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);" }, h("img",{ src:"assets/instagram.png", alt:"Instagram" })),
            h("a",{ href:"https://facebook.com/meksmediatech", target:"_blank", style:"background:#1877F2;" }, h("img",{ src:"assets/facebook.png", alt:"Facebook" }))
        ])
    ]);
}

render(h(ContactPage), document.getElementById("app"));
</script>

</body>
</html>
