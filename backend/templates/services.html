<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meks Media Tech – Services</title>

<!-- Preact UMD -->
<script src="https://unpkg.com/preact@10.19.3/dist/preact.umd.js"></script>
<script src="https://unpkg.com/preact@10.19.3/hooks/dist/hooks.umd.js"></script>

<style>
body { margin:0; background:#000; color:#fff; font-family:Arial; line-height:1.7; }

header { background:#111; border-bottom:1px solid #A6700C; padding:1rem; display:flex; justify-content:space-between; align-items:center; }
header img { height:40px; }
.hamburger { font-size:26px; cursor:pointer; color:#A6700C; }

.sidebar { position:fixed; left:-260px; top:0; width:260px; height:100vh; background:#111; border-right:2px solid #A6700C; padding-top:60px; transition:0.3s; z-index:2000; }
.sidebar.open { left:0; }
.sidebar a { display:block; padding:1rem; color:#fff; text-decoration:none; border-bottom:1px solid #222; }
.sidebar a:hover { background:#A6700C; }

.container { padding:1rem; max-width:900px; margin:auto; }

h1,h2 { text-align:center; color:#A6700C; margin-bottom:1rem; }

.service-card {
    background:#111; border:1px solid #333; border-radius:10px;
    margin-bottom:1rem; padding:1rem; overflow:hidden;
    height:200px; position:relative;
}
.service-title { font-size:20px; margin:0.5rem 0; color:#A6700C; }
.expand-btn {
    background:none; border:none; color:#A6700C;
    font-size:22px; position:absolute; right:10px; top:10px; cursor:pointer;
}
.service-desc { display:none; margin-top:0.5rem; text-align:justify; }

.faq-section { margin-top:2rem; }
.faq-item { border:1px solid #333; border-radius:8px; margin-bottom:1rem; padding:0.5rem; background:#111; }
.faq-question { cursor:pointer; display:flex; justify-content:space-between; font-weight:bold; }
.faq-answer { display:none; margin-top:0.5rem; text-align:justify; }

footer { margin-top:2rem; padding:1rem; background:#111; border-top:1px solid #A6700C; text-align:center; }
footer a { color:#A6700C; margin:0 10px; text-decoration:none; }
</style>
</head>

<body>

<div id="app"></div>

<script>
const { h, render } = preact;
const { useEffect, useState } = preactHooks;

function ServicesPage() {

    const [services, setServices] = useState([]);
    const [faqs, setFaqs] = useState([]);

    useEffect(() => {
        fetch("/api/services")
            .then(res => res.json())
            .then(data => setServices(Array.isArray(data) ? data : []));

        fetch("/api/faqs")
            .then(res => res.json())
            .then(data => setFaqs(Array.isArray(data) ? data : []));
    }, []);

    useEffect(() => {
        let sidebar = document.getElementById("sidebar");
        let sidebarTimer;

        function toggleSidebar() {
            sidebar.classList.toggle("open");
            resetSidebarAutoClose();
        }
        function closeSidebar() { sidebar.classList.remove("open"); }
        function resetSidebarAutoClose() {
            clearTimeout(sidebarTimer);
            sidebarTimer = setTimeout(closeSidebar, 5000);
        }

        document.querySelector(".hamburger").addEventListener("click", toggleSidebar);

        document.body.addEventListener("click", e => {
            if (!sidebar.contains(e.target) && !e.target.classList.contains("hamburger"))
                closeSidebar();
        });

        sidebar.addEventListener("mouseleave",
            () => { sidebarTimer = setTimeout(closeSidebar, 3000); }
        );
    }, []);

    return h("div", {}, [

        h("header", {}, [
            h("div", { class: "hamburger" }, "☰"),
            h("img", { src: "assets/logo.png", style: "margin-left:auto;" })
        ]),

        h("div", { id: "sidebar", class: "sidebar" }, [
            h("a", { href: "index" }, "Home"),
            h("a", { href: "about" }, "About"),
            h("a", { href: "services", style: "background:#A6700C;" }, "Services"),
            h("a", { href: "gallery" }, "Gallery"),
            h("a", { href: "testimonials" }, "Testimonials"),
            h("a", { href: "contact" }, "Contact")
        ]),

        h("div", { class: "container" }, [

            h("h1", {}, "Our Services"),

            services.map(s =>
                serviceCard(s.title, s.description)
            ),

            h("div", { class: "faq-section" }, [
                h("h2", {}, "Frequently Asked Questions"),
                faqs.map(f =>
                    faq(f.question, f.answer)
                )
            ])
        ]),

        h("footer", {}, [
            h("a", { href: "index" }, "Home"),
            h("a", { href: "gallery" }, "Gallery"),
            h("a", { href: "contact" }, "Contact"),
            h("p", { style: "color:#555;" }, "© 2025 Meks Media Tech")
        ])
    ]);
}

/* ==== COMPONENT HELPERS (UNCHANGED) ==== */

function serviceCard(title, desc) {
    return h("div", { class: "service-card" }, [
        h("h2", { class: "service-title" }, title),
        h("button", { class: "expand-btn", onclick: toggleDesc }, "+"),
        h("p", { class: "service-desc" }, desc)
    ]);
}

function faq(question, answer) {
    return h("div", { class: "faq-item" }, [
        h("div", { class: "faq-question", onclick: toggleFAQ }, [
            h("span", {}, question),
            h("span", {}, "+")
        ]),
        h("div", { class: "faq-answer" }, answer)
    ]);
}

/* ===== JS LOGIC (UNCHANGED) ===== */

function toggleDesc(e) {
    let card = e.target.closest(".service-card");
    let desc = card.querySelector(".service-desc");
    let visible = desc.style.display === "block";
    desc.style.display = visible ? "none" : "block";
    e.target.textContent = visible ? "+" : "−";
}

function toggleFAQ(e) {
    let container = e.target.closest(".faq-question");
    let answer = container.nextElementSibling;
    let icon = container.querySelector("span:last-child");
    let visible = answer.style.display === "block";
    answer.style.display = visible ? "none" : "block";
    icon.textContent = visible ? "+" : "−";
}

render(h(ServicesPage), document.getElementById("app"));
</script>

</body>
</html>
