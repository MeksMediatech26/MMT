<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meks Media Tech – Gallery</title>

<!-- Preact UMD -->
<script src="https://unpkg.com/preact@10.19.3/dist/preact.umd.js"></script>
<script src="https://unpkg.com/preact@10.19.3/hooks/dist/hooks.umd.js"></script>

<style>
body { margin:0; background:#000; color:#fff; font-family:Arial; line-height:1.7; }

/* HEADER */
header {
  background:#111; border-bottom:1px solid #A6700C;
  padding:1rem; display:flex; justify-content:space-between; align-items:center;
}
header img { height:40px; }
.hamburger { font-size:26px; cursor:pointer; color:#A6700C; }

/* SIDEBAR */
.sidebar {
  position:fixed; left:-260px; top:0; width:260px; height:100vh;
  background:#111; border-right:2px solid #A6700C;
  padding-top:60px; transition:0.3s; z-index:2000;
}
.sidebar.open { left:0; }
.sidebar a {
  display:block; padding:1rem; color:#fff;
  text-decoration:none; border-bottom:1px solid #222;
}
.sidebar a:hover { background:#A6700C; }

/* CONTAINER */
.container { padding:1rem; max-width:1100px; margin:auto; }
h1,h2 { text-align:center; color:#A6700C; margin-bottom:1rem; }

/* TABS */
.tabs {
  display:flex; justify-content:center; margin-bottom:1.5rem;
}
.tab {
  padding:10px 20px; margin:0 5px; cursor:pointer;
  border:1px solid #A6700C; color:#A6700C;
  border-radius:20px; font-weight:bold;
}
.tab.active {
  background:#A6700C; color:#000;
}

/* GRID */
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
  gap:1rem;
}
.grid-item {
  position:relative;
  background:#111;
  border:1px solid #333;
  border-radius:10px;
  cursor:pointer;
  overflow:hidden;
}
.grid-item img,
.grid-item video {
  width:100%;
  height:180px;
  object-fit:cover;
  display:block;
}

/* TITLE OVERLAY */
.media-title {
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:6px 10px;
  font-size:13px;
  background:rgba(0,0,0,0.65);
  color:#A6700C;
  text-align:center;
}

/* MODAL */
.modal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
  z-index:3000;
}
.modal-content {
  max-width:90%;
  max-height:90%;
  background:#111;
  padding:1rem;
  border-radius:10px;
  text-align:center;
}
.modal-content img,
.modal-content video {
  width:100%;
  border-radius:10px;
}
.modal-title {
  margin-top:10px;
  color:#A6700C;
  font-weight:bold;
}

/* FOOTER */
footer {
  margin-top:2rem; padding:1rem;
  background:#111; border-top:1px solid #A6700C;
  text-align:center;
}
footer a { color:#A6700C; margin:0 10px; text-decoration:none; }
</style>
</head>

<body>
<div id="app"></div>

<script>
const { h, render } = preact;
const { useState, useEffect } = preactHooks;

/* RESOLVERS (UNCHANGED) */
function resolvePhoto(item) {
  if (!item || typeof item !== 'object') return "assets/avatar.png";
  let src = item.url || item.image || item.photo || item.img || "";
  if (!src.startsWith("http") && !src.startsWith("/") && !src.startsWith("data:")) {
    src = "/" + src;
  }
  return src || "assets/avatar.png";
}

function resolveVideo(item) {
  if (!item || typeof item !== 'object') return "";
  let src = item.url || item.video || "";
  if (!src.startsWith("http") && !src.startsWith("/") && !src.startsWith("data:")) {
    src = "/" + src;
  }
  return src;
}

function GalleryPage() {
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [activeTab, setActiveTab] = useState("photos");
  const [photos, setPhotos] = useState([]);
  const [videos, setVideos] = useState([]);
  const [modalItem, setModalItem] = useState(null);
  const [modalType, setModalType] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  useEffect(() => {
    fetch("/api/gallery")
      .then(r => r.json())
      .then(d => {
        setPhotos(d.photos || []);
        setVideos(d.videos || []);
        setLoading(false);
      })
      .catch(() => {
        setError("Failed to load gallery");
        setLoading(false);
      });
  }, []);

  function openModal(item, type) {
    setModalItem(item);
    setModalType(type);
  }

  function closeModal() {
    setModalItem(null);
    setModalType(null);
  }

  return h("div",{},[
    h("header",{},[
      h("div",{class:"hamburger",onClick:()=>setSidebarOpen(!sidebarOpen)},"☰"),
      h("img",{src:"assets/logo.png"})
    ]),

    h("div",{class:sidebarOpen?"sidebar open":"sidebar"},[
      h("a",{href:"index"},"Home"),
      h("a",{href:"about"},"About"),
      h("a",{href:"services"},"Services"),
      h("a",{href:"gallery",style:"background:#A6700C;"},"Gallery"),
      h("a",{href:"contact"},"Contact")
    ]),

    h("div",{class:"container"},[
      h("h1",{},"Gallery"),

      h("div",{class:"tabs"},[
        h("div",{class:activeTab==="photos"?"tab active":"tab",onClick:()=>setActiveTab("photos")},"Photos"),
        h("div",{class:activeTab==="videos"?"tab active":"tab",onClick:()=>setActiveTab("videos")},"Videos")
      ]),

      loading && h("p",{style:"text-align:center;color:#A6700C;"},"Loading..."),
      error && h("p",{style:"text-align:center;color:red;"} , error),

      activeTab==="photos" && h("div",{class:"grid"},
        photos.map(p =>
          h("div",{class:"grid-item",onClick:()=>openModal(p,"photo")},[
            h("img",{src:resolvePhoto(p)}),
            h("div",{class:"media-title"},p.title || "Photo")
          ])
        )
      ),

      activeTab==="videos" && h("div",{class:"grid"},
        videos.map(v =>
          h("div",{class:"grid-item",onClick:()=>openModal(v,"video")},[
            h("video",{src:resolveVideo(v)}),
            h("div",{class:"media-title"},v.title || "Video")
          ])
        )
      )
    ]),

    modalType && h("div",{class:"modal",style:"display:flex",onClick:closeModal},[
      h("div",{class:"modal-content",onClick:e=>e.stopPropagation()},[
        modalType==="photo" && h("img",{src:resolvePhoto(modalItem)}),
        modalType==="video" && h("video",{src:resolveVideo(modalItem),controls:true,autoPlay:true}),
        h("div",{class:"modal-title"},modalItem?.title || ""),
        h("button",{onClick:closeModal,style:"margin-top:12px;background:#A6700C;border:none;padding:8px 16px;font-weight:bold;cursor:pointer;"},"Close")
      ])
    ]),

    h("footer",{},[
      h("a",{href:"index"},"Home"),
      h("a",{href:"about"},"About"),
      h("a",{href:"services"},"Services"),
      h("a",{href:"contact"},"Contact"),
      h("p",{style:"color:#555;"},"© 2025 Meks Media Tech")
    ])
  ]);
}

render(h(GalleryPage), document.getElementById("app"));
</script>
</body>
</html>
